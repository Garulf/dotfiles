# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'vascomfnunes/tmux-clima'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'


# General
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
set -as terminal-features ',*:sixel:RGB'
set -g default-terminal "tmux-256color"
set -g set-clipboard on

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set-option -g lock-command "vlock -c"
set -g lock-after-time 910 # Seconds; 0 = never

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# omerxx/tmux-floax
set -g @floax-window-bg '#1e1e2f'

# xamut/tmux-weather
set-option -g @tmux-weather-units "u"
set-option -g @tmux-weather-format "%c%t"
set-option -g @tmux-weather-location "philadelphia"

# catppuccin/tmux
set -g @catppuccin_flavour 'mocha'
# A manual `rename-window` (which flips automatic-rename off, so
# #{automatic-rename} reads 0) supersedes the path/ssh scheme here.
set -g @_win_name "#{?automatic-rename,#{?#{==:#{pane_current_command},ssh},󰒍 #(ps --ppid #{pane_pid} -o args= 2>/dev/null | grep -m1 ^ssh | sed 's/.* //'),#{b:pane_current_path}},#{window_name}}"
# Columns each window gets once status-left (10) and status-right (60) are
# spoken for; the e| prefix forces numeric (not lexicographic) comparison.
set -g @_win_budget "#{e|/:#{e|-:#{client_width},70},#{session_windows}}"
set -g @_win_has_name "#{e|>=:#{E:@_win_budget},10}"

# tmux-plugins/tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '2'

# tmux-plugins/tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~nvim->v *" "~claude"'
set -g @resurrect-dir '~/.tmux/resurrect'
resurrect_dir="$HOME/.tmux/resurrect"
set -g @resurrect-dir $resurrect_dir
set -g @resurrect-hook-post-save-all "sed 's/--cmd[^ ]* [^ ]* [^ ]*//g' $resurrect_dir/last | sponge $resurrect_dir/last"


# Keybinds
bind -n M-l lock-session

# Nested tmux: F12 toggles key passthrough to inner session
bind -n F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=colour245,bg=colour238" \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# vi-mode
set-window-option -g mode-keys vi

# Split panes in cwd
bind '"' split-window -v -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'

# Open $EDITOR in cwd as a split pane
# split-window mangles a bare $VAR in its command arg, so resolve it via a
# real shell (run-shell) instead, same trick as the ssh-hostname/popup binds
bind e run-shell 'tmux split-window -h -t "#{pane_id}" -c "#{pane_current_path}" "$EDITOR \"#{pane_current_path}\""'

# Window
bind-key -n M-1 if-shell 'tmux select-window -t :1' '' 'new-window -t :1 -c "#{pane_current_path}"'
bind-key -n M-2 if-shell 'tmux select-window -t :2' '' 'new-window -t :2 -c "#{pane_current_path}"'
bind-key -n M-3 if-shell 'tmux select-window -t :3' '' 'new-window -t :3 -c "#{pane_current_path}"'
bind-key -n M-4 if-shell 'tmux select-window -t :4' '' 'new-window -t :4 -c "#{pane_current_path}"'
bind-key -n M-5 if-shell 'tmux select-window -t :5' '' 'new-window -t :5 -c "#{pane_current_path}"'
bind-key -n M-6 if-shell 'tmux select-window -t :6' '' 'new-window -t :6 -c "#{pane_current_path}"'
bind-key -n M-7 if-shell 'tmux select-window -t :7' '' 'new-window -t :7 -c "#{pane_current_path}"'
bind-key -n M-8 if-shell 'tmux select-window -t :8' '' 'new-window -t :8 -c "#{pane_current_path}"'
bind-key -n M-9 if-shell 'tmux select-window -t :9' '' 'new-window -t :9 -c "#{pane_current_path}"'
bind-key -n M-0 if-shell 'tmux select-window -t :0' '' 'new-window -t :0 -c "#{pane_current_path}"'

# Panes
bind-key -n M-'!' if-shell 'tmux join-pane -h -t :1' '' 'break-pane -t :1'
bind-key -n M-'@' if-shell 'tmux join-pane -h -t :2' '' 'break-pane -t :2'
bind-key -n M-'#' if-shell 'tmux join-pane -h -t :3' '' 'break-pane -t :3'
bind-key -n M-'$' if-shell 'tmux join-pane -h -t :4' '' 'break-pane -t :4'
bind-key -n M-'%' if-shell 'tmux join-pane -h -t :5' '' 'break-pane -t :5'
bind-key -n M-'^' if-shell 'tmux join-pane -h -t :6' '' 'break-pane -t :6'
bind-key -n M-'&' if-shell 'tmux join-pane -h -t :7' '' 'break-pane -t :7'
bind-key -n M-'*' if-shell 'tmux join-pane -h -t :8' '' 'break-pane -t :8'
bind-key -n M-'(' if-shell 'tmux join-pane -h -t :9' '' 'break-pane -t :9'
bind-key -n M-')' if-shell 'tmux join-pane -h -t :0' '' 'break-pane -t :0'

bind-key -n M-'x' kill-pane
bind-key -n M-'X' kill-window
bind-key -n M-'K' confirm kill-server

# passthrough: sends the prefix keystroke into the pane instead of the outer
# tmux acting on it, so a nested tmux session can receive its own prefix
bind-key -n C-a send-prefix

bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R

bind -n M-S-Up swap-pane -U
bind -n M-S-Down swap-pane -D

# toggle zoom
bind -n M-f run 'tmux resize-pane -Z'

# shrink pane
bind -n M-- resize-pane -L 5
# expand pane
bind -n M-= resize-pane -R 5

# popup terminal (per-window scratch session, named scratch-<session>-<window_index>)
# display-popup's command arg doesn't expand #{} formats; run-shell does,
# so we use it to pre-expand values before calling display-popup
bind -n M-U if-shell -F '#{m/ri:^scratch-,#{session_name}}' {
    detach-client
  } {
    run-shell "tmux display-popup -E -c '#{client_name}' -xC -yC -w60% -h60% 'if tmux has-session -t scratch-#{session_name}-#{window_index} 2>/dev/null; then exec tmux attach-session -t scratch-#{session_name}-#{window_index}; else tmux new-session -d -c \"#{pane_current_path}\" -s scratch-#{session_name}-#{window_index} && tmux set-option -t scratch-#{session_name}-#{window_index} status off && exec tmux attach-session -t scratch-#{session_name}-#{window_index}; fi'"
}

# auto-kill per-window scratch session when its parent window closes
set-hook -g window-unlinked 'run-shell "tmux kill-session -t scratch-#{session_name}-#{window_index} 2>/dev/null; true"'

# Send Android notification on bell (requires Termux:API)
set -g bell-action any
set-hook -g alert-bell 'run-shell "termux-notification -t \"Bell\" -c \"#{session_name}:#{window_name}\" 2>/dev/null; true"'

set -g popup-border-style "fg=#0188b4"

bind -T popup M-` detach
bind -T popup C-o copy-mode
bind -T popup M-c new-window -c '#{pane_current_path}'
bind -T popup M-n next-window
bind -T popup M-m previous-window
bind -T popup M-'x' kill-pane

bind -T popup M-L run 'tmux move-window -a -t $TMUX_PARENT_SESSION:{next}'

# bind -n M-` display-popup -h 60% -w 80% -E /home/garulf/scripts/show-tmux-popup.sh
# bind-key -T prefix x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key C-c display-popup -E -w 80 -h 30 "/usr/local/bin/claude-tmux"

# Claude Code session switcher: enter jumps the client to that session's pane
# and closes the popup. switch-client works from inside a popup, so no -c is
# needed; the venv entrypoint is an editable install, so it tracks the source.
bind-key j display-popup -E -w 70% -h 70% "/home/Garulf/projects/claude_ops/.venv/bin/claude-ops --sessions"

# Searchable keybinding cheat sheet (enter invokes the selected bind)
bind-key k run-shell 'tmux display-popup -E -w 85% -h 70% "/home/Garulf/projects/tmux-cheatsheet/tmux-cheatsheet.sh --pane #{pane_id}"'
bind-key -T prefix x kill-pane

# use the same custom name (icon + hostname/path) shown in the status bar, but
# untruncated: the tree pane isn't competing with status-left/right for space
bind-key w choose-tree -Zw -F "#{window_index}: #{E:@_win_name}#{window_flags}"


set -g @yank_with_mouse off

run '~/.tmux/plugins/tpm/tpm'

# Window formats are written out here instead of via @catppuccin_window_text so
# the name's coloured block can be dropped along with the name, leaving a bare
# number rather than an empty swatch. They need catppuccin's @thm_* palette, so
# they have to follow tpm. Style directives are split into one #[] each because
# a comma inside a #{?} branch would be read as an argument separator.
#
# Inactive names shed detail as windows multiply or the terminal narrows: full
# name at a budget of 20+, 10 chars at 14+, 5 chars at 10+, bare #I below that.
# tmux only accepts a literal truncation width, hence the fixed tiers. A bell
# turns the number block yellow, which survives a collapse and needs no width;
# yellow sits on the blue-yellow axis that red/green colour blindness leaves
# intact, and blink plus underscore carry the same signal without colour. The
# current window always shows its full name.
set -g window-status-bell-style default
set -g window-status-format "#[fg=#{@thm_crust}]#[bg=#{?window_bell_flag,#{@thm_yellow},#{@thm_overlay_2}}]#{?window_bell_flag,#[blink]#[underscore],#[noblink]#[nounderscore]} #I #{?#{E:@_win_has_name},#[noblink]#[nounderscore]#[fg=#{@thm_fg}]#[bg=#{@thm_surface_0}] #{?#{e|>=:#{E:@_win_budget},20},#{E:@_win_name},#{?#{e|>=:#{E:@_win_budget},14},#{=10:#{E:@_win_name}},#{=5:#{E:@_win_name}}}} ,}"
set -g window-status-current-format "#[fg=#{@thm_crust}]#[bg=#{@thm_mauve}] #I #[fg=#{@thm_fg}]#[bg=#{@thm_surface_1}] #{E:@_win_name} "

# tmux-floax binds "p" to its floating popup terminal by default; restore tmux's default previous-window
bind p previous-window

# Override tmux-yank: use OSC 52 via tmux's internal clipboard (works over SSH)
bind-key -T root MouseDrag1Pane if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -M"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g allow-passthrough on
set -ga update-environment TERM
# Don't sync COLORTERM from the attaching client: SSH never forwards it
# (AcceptEnv is LANG/LC_* only), so update-environment would *unset* it and
# truecolor-capable apps (e.g. Textual) drop to 256 colors. The *:RGB
# terminal-features above already assert every outer terminal does RGB,
# so claim truecolor unconditionally.
set-environment -g COLORTERM truecolor

# Highlight status bar when prefix is active (overrides catppuccin's static style)
set -g status-style "bg=#{?client_prefix,#{@thm_red},#{@_ctp_status_bg}},fg=#{@thm_fg}"

# "pane title" [hostname] time (time last so it's the last thing truncated
# on smaller screens; forced to America/New_York, 12h, no leading zero —
# tmux's own %I/%H specifiers use the system tz, so shell out with TZ set
# to pin it to EST/EDT regardless of the host's local tz)
# tmux-weather's own placeholder substitution runs at `tpm` load (above,
# before status-right is even set below), so it would no-op; call its
# script directly instead, same as the cpu/mem widgets. Routed through our
# own wrapper, which strips the VS16 variation selector wttr.in's icons
# carry — tmux's width table renders it as 1 cell while the terminal
# renders the emoji it modifies as 2, squishing it into the next character.
set -g @_status_right_full "#(/home/Garulf/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" [#h] #(/home/Garulf/.config/tmux/scripts/weather.sh) #(/home/Garulf/.config/tmux/scripts/cpu_sparkline.sh) #(/home/Garulf/.config/tmux/scripts/mem_bar.sh) #(TZ='America/New_York' date +'%-I:%M%p')"
# Once window names collapse to bare numbers (@_win_has_name off), the
# leading save/pane-title/hostname segments are dropped so tabs keep their
# space; the cpu sparkline onward is the most space is ever truncated to.
set -g @_status_right_short "#(/home/Garulf/.config/tmux/scripts/weather.sh) #(/home/Garulf/.config/tmux/scripts/cpu_sparkline.sh) #(/home/Garulf/.config/tmux/scripts/mem_bar.sh) #(TZ='America/New_York' date +'%-I:%M%p')"
# Prefix active: blank the right status entirely so window tabs get the room.
set -g status-right "#{?client_prefix,,#{?#{E:@_win_has_name},#{E:@_status_right_full},#{E:@_status_right_short}}}"
set -g status-right-length 60
